name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

      - name: Test
        run: swift test
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
